<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>العيادة — إدارة الرعاية</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نظام إدارة العيادة — المرضى والمواعيد والسجلات الطبية والحسابات.">
  <meta name="theme-color" content="#12284b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    IBM Plex Sans Arabic is the primary UI font; Inter carries Latin text when
    the language is switched to English. Both are loaded up front because the
    language can flip at runtime without a reload, and a font swap mid-session
    is far more jarring than the extra request.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <!--
    Applied before first paint so a dark-mode user never sees a white flash and
    an English user never sees the Arabic RTL layout flicker. Arabic RTL is the
    default; mirrors ThemeService / LanguageService storage keys.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clinic.theme');
        var dark = stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');

        var lang = localStorage.getItem('clinic.lang');
        if (lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) { /* storage blocked — fall back to the Arabic RTL default */ }
    })();
  </script>
</head>
<body>
